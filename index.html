        <h1>Dr. Justinas Miseikis - AI Strategy Advisor, Keynote Speaker and Research Commercialization Expert</h1>
        <p>Dr. Justinas Miseikis is an AI strategy advisor, innovation consultant, keynote speaker, and research commercialization expert based in Zurich, Switzerland. He currently serves as Strategy and Partnerships Manager at Sony AI, leading research commercialization strategy for 4 R&D teams. Available for advisory, consulting, and speaking across DACH and Europe.</p>

          <li>Robotics in the Greater Zurich Area directory (150+ companies, labs and autonomous systems innovators) - listed with the agreement of Greater Zurich Area, available at /gza-robotics.</li>
          <li>Swiss Robotics Startups directory (100+ Swiss robotics startups) - curated by Swisscom Ventures and listed in the Resources hub with mutual agreement.</li>
        </ul>
        <h2>Education</h2>
        <p>PhD in Robotics and Computer Vision from the University of Oslo. Executive MBA from Quantic School of Business and Technology.</p>
        <h2>TechDrive Zürich - Founder and Host</h2>
        <p>Dr. Justinas Mišeikis is the Founder and Host of TechDrive Zürich (<a href="https://techdrive.tv/">techdrive.tv</a>), an interview and podcast series spotlighting founders, researchers and operators shaping Switzerland's AI, robotics and deep tech ecosystem.</p>
        <h2>Services Available Across DACH and Europe</h2>
        <ul>
          <li>AI Commercialization Advisory and Research-to-Market Strategy</li>
          <li>Due Diligence for Investors and VCs in AI, Robotics, and Computer Vision</li>
          <li>Corporate Innovation Consulting and Partnership Advisory</li>
          <li>Keynote Speaking and Public Speaking on AI, Robotics, and Strategy</li>
          <li>Startup Mentoring and Corporate-Startup Partnership Development</li>
        </ul>
        <h2>Speaking Topics</h2>
        <ul>
          <li>AI Commercialization and Ethics</li>
          <li>Future of Human-Robot Interaction</li>
          <li>Computer Vision in Industry</li>
          <li>Bringing Research to Commercialization</li>
          <li>Strategy for Innovation Leaders</li>
        </ul>
        <h2>Research</h2>
        <p>15+ peer-reviewed publications in robotics, AI, and computer vision. 700+ citations. 40+ patents in AI and robotics. Records: <a href="https://scholar.google.com/citations?user=KeZ1-AwAAAAJ">Google Scholar</a>, <a href="https://patents.google.com/?inventor=justinas+miseikis,justinas+mi%C5%A1eikis">Google Patents</a>.</p>
        <h2>Curated Ecosystem Resources</h2>

        </ul>

        <p>Based in Zurich, Switzerland. Active across Germany, Austria, Switzerland (DACH), and Europe. Advisory work and talks are delivered in English.</p>

      (function() {
        // Redirect old hash-based URLs (e.g. /#/tech-events) to clean URLs
        if (window.location.hash && window.location.hash.startsWith('#/')) {
          var cleanPath = window.location.hash.substring(1);
          window.history.replaceState(null, '', cleanPath);
        }
        // Handle SPA redirect from 404.html
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('p');
        if (redirect) {
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
